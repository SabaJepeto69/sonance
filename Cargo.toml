[package]
name = "sonance"
version = "0.1.0"
edition = "2024"
description = "A native Linux Sonos controller: playback, rooms, Spotify, alarms, a 3D room tuner and Bluetooth speakers in sync"
license = "MIT"
repository = "https://github.com/SabaJepeto69/sonance"
readme = "README.md"
keywords = ["sonos", "gtk", "libadwaita", "pipewire", "bluetooth"]
categories = ["multimedia::audio"]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
futures = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
html-escape = "0.2.15"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
urlencoding = "2.1.3"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
